name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: python check_mcp.py
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh build.sh
      - name: Exercise protocol state machine without Bluetooth
        run: |
          cat DriveRoundTrip.swift tests/DriveRoundTripTests.swift > .build/DriveTests.swift
          xcrun swiftc -parse-as-library .build/DriveTests.swift -o .build/drive-tests
          .build/drive-tests
